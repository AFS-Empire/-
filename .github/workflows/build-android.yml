name: 构建 Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ========== JOB 1: 构建 APK（核心，必须成功） ==========
  build-apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Java 17（Capacitor 6 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 安装 npm 依赖
        run: npm ci

      - name: 构建 Web 资源
        run: npx vite build
        env:
          ARCHIVE_RELEASE: '1'
          ARCHIVE_PRIVATE_SALT: ${{ secrets.ARCHIVE_PRIVATE_SALT }}

      - name: 缓存 Android 工程
        id: cache-android
        uses: actions/cache@v4
        with:
          path: android
          key: android-project-v6-${{ hashFiles('capacitor.config.json') }}

      - name: 首次生成 Android 工程
        if: steps.cache-android.outputs.cache-hit != 'true'
        run: npx cap add android

      - name: 同步 Capacitor
        run: npx cap sync android

      - name: 配置 Android 工程（仅 proguard + manifest，不改 build.gradle）
        run: node scripts/setup-android.mjs

      - name: 注入签名配置（init.gradle 方案，不碰 build.gradle）
        run: |
          echo "=== 创建 gradle.properties ==="
          cat > android/app/gradle.properties << 'EOF'
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=OrpheusArchive2026
          RELEASE_KEY_ALIAS=orpheus
          RELEASE_KEY_PASSWORD=OrpheusArchive2026
          EOF

          echo ""
          echo "=== 创建 init.gradle（签名注入，不修改 build.gradle） ==="
          cat > signing-init.gradle << 'INIT_EOF'
          // ORPHEUS init.gradle - CI 签名注入
          // 通过 --init-script 参数加载，不修改 build.gradle
          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin('com.android.application')) {
                      def storeFile = project.findProperty('RELEASE_STORE_FILE')
                      def storePassword = project.findProperty('RELEASE_STORE_PASSWORD')
                      def keyAlias = project.findProperty('RELEASE_KEY_ALIAS')
                      def keyPassword = project.findProperty('RELEASE_KEY_PASSWORD')

                      if (storeFile && storePassword && keyAlias && keyPassword) {
                          project.android.signingConfigs {
                              release {
                                  storeFile project.file(storeFile)
                                  storePassword storePassword
                                  keyAlias keyAlias
                                  keyPassword keyPassword
                              }
                          }
                          project.android.buildTypes.release.signingConfig = project.android.signingConfigs.release
                          println "[ORPHEUS] ✅ Release signing config injected via init.gradle"
                      } else {
                          println "[ORPHEUS] ⚠️ Signing properties not found, using debug signing"
                      }
                  }
              }
          }
          INIT_EOF
          cat signing-init.gradle

      - name: 缓存签名密钥
        id: keystore
        uses: actions/cache@v4
        with:
          path: android/app/release.keystore
          key: release-keystore-v1

      - name: 创建签名密钥
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias orpheus \
            -keyalg RSA -keysize 2048 \
            -validity 36500 \
            -storepass OrpheusArchive2026 \
            -keypass OrpheusArchive2026 \
            -dname "CN=AFS-JZY, OU=Archive, O=OrpheusEmpire, L=Unknown, ST=Unknown, C=CN"

      - name: 构建 Release APK
        run: |
          echo "=== 开始构建 APK（init.gradle 注入签名） ==="
          cd android
          ./gradlew assembleRelease \
            --init-script ../signing-init.gradle \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD=OrpheusArchive2026 \
            -PRELEASE_KEY_ALIAS=orpheus \
            -PRELEASE_KEY_PASSWORD=OrpheusArchive2026
          cd ..
          echo "=== 构建完成 ==="
          echo "APK 文件列表："
          find android/app/build/outputs/apk/release -name "*.apk" -ls

      - name: 重命名 APK
        run: |
          APK="$(find android/app/build/outputs/apk/release -name "*.apk" -not -name "*unsigned*" | head -1)"
          if [ -z "$APK" ]; then
            APK="$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)"
          fi
          if [ -z "$APK" ]; then
            echo "❌ 找不到 APK 文件！"
            find android/app/build/outputs/apk/ -name "*.apk" 2>/dev/null || echo "release 目录下无 APK"
            exit 1
          fi
          echo "找到 APK: $APK"
          cp "${APK}" "orpheus-archive.apk"
          echo "APK_PATH=orpheus-archive.apk" >> "${GITHUB_ENV}"
          ls -la orpheus-archive.apk

      - name: 上传 APK 产物（90 天保留）
        uses: actions/upload-artifact@v4
        with:
          name: orpheus-archive-apk
          path: orpheus-archive.apk
          retention-days: 90

      - name: 验证 APK 签名
        run: |
          if grep -c "APK Sig Block 42" "${{ env.APK_PATH }}" > /dev/null 2>&1; then
            echo "✅ APK V2 签名验证通过"
          else
            echo "⚠️ APK 未检测到 V2 签名（可能使用 debug 签名）"
          fi

      - name: 准备发布目录
        run: |
          mkdir -p dist/apk
          cp "${{ env.APK_PATH }}" "dist/apk/orpheus-archive.apk"
          echo "APK 已放入 dist/apk/"

      - name: 生成下载页和版本信息
        env:
          VERSION: v1.0.${{ github.run_number }}
          BUILD_NUM: ${{ github.run_number }}
          APK_PATH: ${{ env.APK_PATH }}
        run: node scripts/generate-apk-index.mjs

      - name: 上传 dist 目录（供 Netlify 部署）
        uses: actions/upload-artifact@v4
        with:
          name: dist-output
          path: dist
          retention-days: 7

  # ========== JOB 2: 发布到 GitHub Release（尽力而为，不阻断） ==========
  release:
    name: 发布到 GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: orpheus-archive-apk

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 奥菲斯帝国档案馆 v1.0.${{ github.run_number }}
          files: orpheus-archive.apk
          generate_release_notes: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========== JOB 3: 部署到 Netlify（尽力而为，不阻断） ==========
  deploy-netlify:
    name: 部署到 Netlify
    needs: build-apk
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: 下载 dist 目录
        uses: actions/download-artifact@v4
        with:
          name: dist-output
          path: dist

      - name: 部署到 Netlify
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "${NETLIFY_SITE_ID}" ] || [ -z "${NETLIFY_AUTH_TOKEN}" ]; then
            echo "未配置 Netlify secrets，跳过部署"
            exit 0
          fi
          echo "部署目录内容："
          ls -la dist/
          echo ""
          echo "APK 目录内容："
          ls -la dist/apk/
          npm install -g netlify-cli
          netlify deploy --dir=dist --site="${NETLIFY_SITE_ID}" --auth="${NETLIFY_AUTH_TOKEN}" --prod
          echo "Netlify 部署成功"
          echo "APK 下载地址: https://afs-jzy-archive.netlify.app/apk/orpheus-archive.apk"
          echo "下载页面: https://afs-jzy-archive.netlify.app/apk/"
