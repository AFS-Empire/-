name: 构建 Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ========== JOB 1: 构建 APK（核心，必须成功） ==========
  build-apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Java 17（Capacitor 6 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 配置 CI 环境（跳过国内镜像 + 不下载 electron 二进制）
        run: |
          # GitHub Actions 在美国机房，用官方 npm 源比国内镜像快
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc
          echo "fetch-retries=5" >> ~/.npmrc
          echo "fetch-retry-mintimeout=20000" >> ~/.npmrc
          echo "fetch-retry-maxtimeout=120000" >> ~/.npmrc
          echo "legacy-peer-deps=true" >> ~/.npmrc
          # 关键：Android 构建完全不需要 electron 二进制，跳过下载，避免超时
          echo "ELECTRON_SKIP_BINARY_DOWNLOAD=1" >> "${GITHUB_ENV}"
          cat ~/.npmrc

      - name: 安装 npm 依赖
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: 构建 Web 资源
        run: npx vite build
        env:
          ARCHIVE_RELEASE: '1'
          VITE_ARCHIVE_SALT: ${{ secrets.ARCHIVE_PRIVATE_SALT }}
          ARCHIVE_PRIVATE_SALT: ${{ secrets.ARCHIVE_PRIVATE_SALT }}
          VITE_INSTALL_KEY_A: ${{ secrets.INSTALL_KEY_A }}

      - name: 缓存 Android 工程
        id: cache-android
        uses: actions/cache@v4
        with:
          path: android
          key: android-project-v8-${{ hashFiles('capacitor.config.json') }}

      - name: 首次生成 Android 工程
        if: steps.cache-android.outputs.cache-hit != 'true'
        run: npx cap add android

      - name: 同步 Capacitor
        run: npx cap sync android

      - name: 配置 Android 工程（仅 proguard + manifest，不改 build.gradle）
        run: node scripts/setup-android.mjs

      - name: 注入启动图标（Logo → 各分辨率 mipmap）
        run: |
          echo "=== 检查 ImageMagick ==="
          if command -v convert >/dev/null 2>&1; then
            echo "✅ ImageMagick 已安装"
          else
            echo "⬇️ 安装 ImageMagick..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi

          RES_DIR="android/app/src/main/res"
          SRC="public/logo.jpg"
          if [ ! -f "$SRC" ]; then
            echo "❌ logo.jpg 不存在，终止构建"
            exit 1
          fi

          echo ""
          echo "=== 缩放 Logo 到各分辨率 ==="
          # 5 种标准密度 → ic_launcher.png（系统自动处理圆角，无需脚本裁剪）
          for pair in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            DIR="${pair%%:*}"
            SIZE="${pair##*:}"
            mkdir -p "$RES_DIR/$DIR"
            convert "$SRC" -resize "${SIZE}x${SIZE}" -gravity center -extent "${SIZE}x${SIZE}" \
              "$RES_DIR/$DIR/ic_launcher.png"
            cp "$RES_DIR/$DIR/ic_launcher.png" "$RES_DIR/$DIR/ic_launcher_round.png"
            echo "  $DIR → ${SIZE}px  完成"
          done

          # 前台图层（自适应图标需要）
          mkdir -p "$RES_DIR/drawable"
          convert "$SRC" -resize 432x432 -gravity center -extent 432x432 "$RES_DIR/drawable/ic_launcher_foreground.png"
          echo "✅ drawable/ic_launcher_foreground.png 生成"

          # 自适应图标 XML（Android 8+ 必须有，否则用默认 Capacitor 图标）
          echo ""
          echo "=== 创建自适应图标配置 ==="
          mkdir -p "$RES_DIR/mipmap-anydpi-v26"
          cat > "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          XMLEOF
          cp "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"
          echo "✅ mipmap-anydpi-v26/ic_launcher.xml 创建"

          # 背景色（深黑金主题）
          mkdir -p "$RES_DIR/values"
          cat > "$RES_DIR/values/ic_launcher_background.xml" << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0d0d0f</color>
          </resources>
          XMLEOF
          echo "✅ ic_launcher_background.xml 创建（#0d0d0f）"

          echo ""
          echo "=== 验证图标文件 ==="
          for pair in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            DIR="${pair%%:*}"
            SIZE="${pair##*:}"
            if [ ! -f "$RES_DIR/$DIR/ic_launcher.png" ]; then
              echo "❌ $DIR/ic_launcher.png 生成失败"
              exit 1
            fi
            ACTUAL_SIZE=$(identify -format "%wx%h" "$RES_DIR/$DIR/ic_launcher.png" 2>/dev/null || echo "unknown")
            echo "  $DIR/ic_launcher.png → ${ACTUAL_SIZE}"
          done

      - name: 注入签名配置 + 混淆配置
        run: |
          echo "=== 创建 gradle.properties ==="
          cat > android/app/gradle.properties << 'EOF'
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=OrpheusArchive2026
          RELEASE_KEY_ALIAS=orpheus
          RELEASE_KEY_PASSWORD=OrpheusArchive2026
          EOF
          cat android/app/gradle.properties

          echo ""
          echo "=== 注入签名 + 混淆配置到 build.gradle ==="
          python3 scripts/inject-signing.py android/app/build.gradle

          echo ""
          echo "=== build.gradle 关键段落 ==="
          grep -n "signingConfigs\|buildTypes\|signingConfig\|ORPHEUS\|minifyEnabled\|shrinkResources\|proguard" android/app/build.gradle

      - name: 缓存签名密钥
        id: keystore
        uses: actions/cache@v4
        with:
          path: android/app/release.keystore
          key: release-keystore-v1

      - name: 创建签名密钥
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias orpheus \
            -keyalg RSA -keysize 2048 \
            -validity 36500 \
            -storepass OrpheusArchive2026 \
            -keypass OrpheusArchive2026 \
            -dname "CN=AFS-JZY, OU=Archive, O=OrpheusEmpire, L=Unknown, ST=Unknown, C=CN"

      - name: 构建 Release APK
        run: |
          echo "=== 开始构建 APK ==="
          cd android
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD=OrpheusArchive2026 \
            -PRELEASE_KEY_ALIAS=orpheus \
            -PRELEASE_KEY_PASSWORD=OrpheusArchive2026
          cd ..
          echo "=== 构建完成 ==="
          echo "APK 文件列表："
          find android/app/build/outputs/apk/release -name "*.apk" -ls

      - name: 重命名 APK
        run: |
          APK="$(find android/app/build/outputs/apk/release -name "*.apk" -not -name "*unsigned*" | head -1)"
          if [ -z "$APK" ]; then
            APK="$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)"
          fi
          if [ -z "$APK" ]; then
            echo "❌ 找不到 APK 文件！"
            find android/app/build/outputs/apk/ -name "*.apk" 2>/dev/null || echo "release 目录下无 APK"
            exit 1
          fi
          echo "找到 APK: $APK"
          cp "${APK}" "orpheus-archive.apk"
          echo "APK_PATH=orpheus-archive.apk" >> "${GITHUB_ENV}"
          ls -la orpheus-archive.apk

      - name: 上传 APK 产物（90 天保留）
        uses: actions/upload-artifact@v4
        with:
          name: orpheus-archive-apk
          path: orpheus-archive.apk
          retention-days: 90

      - name: 验证 APK 签名
        run: |
          if grep -c "APK Sig Block 42" "${{ env.APK_PATH }}" > /dev/null 2>&1; then
            echo "✅ APK V2 签名验证通过"
          else
            echo "⚠️ APK 未检测到 V2 签名（可能使用 debug 签名）"
          fi

      - name: 准备发布目录
        run: |
          mkdir -p dist/apk
          cp "${{ env.APK_PATH }}" "dist/apk/orpheus-archive.apk"
          echo "APK 已放入 dist/apk/"

      - name: 生成下载页和版本信息
        env:
          VERSION: v1.0.${{ github.run_number }}
          BUILD_NUM: ${{ github.run_number }}
          APK_PATH: ${{ env.APK_PATH }}
        run: node scripts/generate-apk-index.mjs

      - name: 上传 dist 目录（供 Netlify 部署）
        uses: actions/upload-artifact@v4
        with:
          name: dist-output
          path: dist
          retention-days: 7

  # ========== JOB 2: 发布到 GitHub Release（尽力而为，不阻断） ==========
  release:
    name: 发布到 GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: orpheus-archive-apk

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 奥菲斯帝国档案馆 v1.0.${{ github.run_number }}
          files: orpheus-archive.apk
          generate_release_notes: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========== JOB 3: 已移除 Netlify 部署（停止 APK 分发） ==========
