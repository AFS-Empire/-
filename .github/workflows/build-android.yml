name: 构建 Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 安装 npm 依赖
        run: npm ci

      - name: 构建 Web 资源
        run: npx vite build
        env:
          ARCHIVE_RELEASE: '1'
          # 私有盐值从 GitHub Secrets 注入，构建时内联到产物，源码与 git 历史中均不含盐值
          ARCHIVE_PRIVATE_SALT: ${{ secrets.ARCHIVE_PRIVATE_SALT }}

      - name: 缓存 Android 工程
        id: cache-android
        uses: actions/cache@v4
        with:
          path: android
          key: android-project-v4-${{ hashFiles('capacitor.config.json') }}

      - name: 首次生成 Android 工程
        if: steps.cache-android.outputs.cache-hit != 'true'
        run: npx cap add android

      - name: 同步 Capacitor
        run: npx cap sync android

      - name: 配置 Android 工程
        run: node scripts/setup-android.mjs

      - name: 生成签名密钥（缓存复用）
        id: keystore
        uses: actions/cache@v4
        with:
          path: android/app/release.keystore
          key: release-keystore-v1

      - name: 创建签名密钥（缓存未命中时）
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias orpheus \
            -keyalg RSA -keysize 2048 \
            -validity 36500 \
            -storepass OrpheusArchive2026 \
            -keypass OrpheusArchive2026 \
            -dname "CN=AFS-JZY, OU=Archive, O=OrpheusEmpire, L=Unknown, ST=Unknown, C=CN"

      - name: 构建 Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD=OrpheusArchive2026 \
            -PRELEASE_KEY_ALIAS=orpheus \
            -PRELEASE_KEY_PASSWORD=OrpheusArchive2026
          cd ..

      - name: 重命名 APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "orpheus-archive.apk"
          echo "APK_PATH=orpheus-archive.apk" >> $GITHUB_ENV

      - name: 上传 APK 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: orpheus-archive-apk
          path: orpheus-archive.apk
          retention-days: 90

      - name: 验证 APK 签名
        run: |
          APK="${{ env.APK_PATH }}"
          if grep -c "APK Sig Block 42" "$APK" > /dev/null 2>&1; then
            echo "✅ APK V2 签名验证通过"
          else
            echo "⚠️ 警告：APK 未检测到 V2 签名"
          fi

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 奥菲斯帝国档案馆 v1.0.${{ github.run_number }}
          files: ${{ env.APK_PATH }}
          generate_release_notes: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 将 APK 整合进 Web 部署目录
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          mkdir -p dist/apk
          cp "${{ env.APK_PATH }}" "dist/apk/orpheus-archive.apk"
          echo "✅ APK 已放入 dist/apk/"

      - name: 创建 APK 下载页和版本信息
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          cat > dist/apk/index.html << HTMLEOF
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奥菲斯帝国档案馆 · APK 下载</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0f;color:#e8d5b7;font-family:-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{text-align:center;padding:2rem;max-width:400px;width:100%}
h1{color:#d4a857;font-size:1.5rem;margin-bottom:.5rem}
.ver{color:#8a8074;font-size:.85rem;margin-bottom:1.5rem}
.btn{display:inline-block;background:linear-gradient(135deg,#d4a857,#b8862e);color:#1a1a1c;text-decoration:none;padding:.9rem 2rem;border-radius:.75rem;font-weight:bold;font-size:1.1rem;transition:transform .15s;cursor:pointer;border:none;width:100%;margin-bottom:.75rem}
.btn:active{transform:scale(.97)}
.btn.secondary{background:transparent;color:#d4a857;border:1px solid #d4a857}
.hint{color:#6a6258;font-size:.75rem;margin-top:1.5rem;line-height:1.6}
.status{color:#d4a857;font-size:.85rem;margin-bottom:1rem;min-height:1.2rem}
</style>
</head>
<body>
<div class="card">
<h1>奥菲斯帝国档案馆</h1>
<p class="ver">Android 安装包</p>
<div class="status" id="status">正在检查版本...</div>
<a href="orpheus-archive.apk" id="downloadBtn" class="btn" style="display:none">下载 APK ($VERSION)</a>
<button id="refreshBtn" class="btn secondary" onclick="checkVersion()">检查最新版本</button>
<p class="hint">开启「允许安装未知来源应用」后安装<br>覆盖更新不会丢失档案数据</p>
</div>
<script>
function checkVersion(){
fetch('version.json?t='+Date.now())
.then(r=>r.json())
.then(d=>{
document.getElementById('status').textContent='当前版本: '+d.version;
document.getElementById('downloadBtn').style.display='inline-block';
document.getElementById('downloadBtn').textContent='下载 '+d.version;
})
.catch(()=>{
document.getElementById('status').textContent='版本信息加载中';
document.getElementById('downloadBtn').style.display='inline-block';
});
}
checkVersion();
</script>
</body>
</html>
HTMLEOF

          cat > dist/apk/version.json << EOFJSON
{"version":"$VERSION","build":${{ github.run_number }},"date":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","size":"$(stat -c%s ${{ env.APK_PATH }} 2>/dev/null || echo 'unknown')"}
EOFJSON
          echo "✅ 下载页和版本信息已创建"

      - name: 部署到 Netlify（含 APK）
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_SITE_ID" ] || [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "⏭️ 未配置 Netlify secrets，跳过部署"
            exit 0
          fi
          echo "📦 部署目录内容："
          ls -la dist/
          echo ""
          echo "📦 APK 目录内容："
          ls -la dist/apk/
          npm install -g netlify-cli
          netlify deploy --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --prod
          echo "✅ Netlify 部署成功"
          echo "📥 APK 下载地址: https://afs-jzy-archive.netlify.app/apk/orpheus-archive.apk"
          echo "📥 下载页面: https://afs-jzy-archive.netlify.app/apk/"
