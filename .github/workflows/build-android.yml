name: 构建 Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 安装 npm 依赖
        run: npm ci

      - name: 构建 Web 资源
        run: npx vite build
        env:
          ARCHIVE_RELEASE: '1'
          # 私有盐值从 GitHub Secrets 注入，构建时内联到产物，源码与 git 历史中均不含盐值
          ARCHIVE_PRIVATE_SALT: ${{ secrets.ARCHIVE_PRIVATE_SALT }}

      - name: 缓存 Android 工程
        id: cache-android
        uses: actions/cache@v4
        with:
          path: android
          key: android-project-v4-${{ hashFiles('capacitor.config.json') }}

      - name: 首次生成 Android 工程
        if: steps.cache-android.outputs.cache-hit != 'true'
        run: npx cap add android

      - name: 同步 Capacitor
        run: npx cap sync android

      - name: 配置 Android 工程
        run: node scripts/setup-android.mjs

      - name: 生成签名密钥（缓存复用）
        id: keystore
        uses: actions/cache@v4
        with:
          path: android/app/release.keystore
          key: release-keystore-v1

      - name: 创建签名密钥（缓存未命中时）
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias orpheus \
            -keyalg RSA -keysize 2048 \
            -validity 36500 \
            -storepass OrpheusArchive2026 \
            -keypass OrpheusArchive2026 \
            -dname "CN=AFS-JZY, OU=Archive, O=OrpheusEmpire, L=Unknown, ST=Unknown, C=CN"

      - name: 构建 Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD=OrpheusArchive2026 \
            -PRELEASE_KEY_ALIAS=orpheus \
            -PRELEASE_KEY_PASSWORD=OrpheusArchive2026
          cd ..

      - name: 重命名 APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "orpheus-archive.apk"
          echo "APK_PATH=orpheus-archive.apk" >> $GITHUB_ENV

      - name: 上传 APK 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: orpheus-archive-apk
          path: orpheus-archive.apk
          retention-days: 90

      - name: 验证 APK 签名
        run: |
          APK="${{ env.APK_PATH }}"
          if grep -c "APK Sig Block 42" "$APK" > /dev/null 2>&1; then
            echo "✅ APK V2 签名验证通过"
          else
            echo "⚠️ 警告：APK 未检测到 V2 签名"
          fi

      - name: 发布到 GitHub Release（非阻断）
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 奥菲斯帝国档案馆 v1.0.${{ github.run_number }}
          files: ${{ env.APK_PATH }}
          generate_release_notes: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 将 APK 整合进 Web 部署目录
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          mkdir -p dist/apk
          cp "${{ env.APK_PATH }}" "dist/apk/orpheus-archive.apk"
          echo "✅ APK 已放入 dist/apk/"

      - name: 生成 APK 下载页和版本信息
        env:
          VERSION: v1.0.${{ github.run_number }}
          BUILD_NUM: ${{ github.run_number }}
          APK_PATH: ${{ env.APK_PATH }}
        run: node scripts/generate-apk-index.mjs

      - name: 部署到 Netlify（非阻断）
        continue-on-error: true
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_SITE_ID" ] || [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "⏭️ 未配置 Netlify secrets，跳过部署"
            exit 0
          fi
          echo "📦 部署目录内容："
          ls -la dist/
          echo ""
          echo "📦 APK 目录内容："
          ls -la dist/apk/
          npm install -g netlify-cli
          netlify deploy --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --prod
          echo "✅ Netlify 部署成功"
          echo "📥 APK 下载地址: https://afs-jzy-archive.netlify.app/apk/orpheus-archive.apk"
          echo "📥 下载页面: https://afs-jzy-archive.netlify.app/apk/"
