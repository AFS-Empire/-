name: 构建 Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ========== JOB 1: 构建 APK（核心，必须成功） ==========
  build-apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Java 17（Capacitor 6 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 配置 CI 环境（覆盖项目 .npmrc + 跳过所有二进制下载）
        run: |
          # ⚠️ 关键 1：直接覆盖"项目级" .npmrc（优先级最高），避免国内镜像导致美国机房超时
          cat > .npmrc << 'EOF'
          registry=https://registry.npmjs.org/
          fetch-retries=5
          fetch-retry-mintimeout=20000
          fetch-retry-maxtimeout=120000
          fetch-timeout=300000
          legacy-peer-deps=true
          EOF
          echo "=== 项目级 .npmrc 已覆盖 ==="
          cat .npmrc

          # ⚠️ 关键 2：设置各种跳过二进制下载的环境变量
          echo "ELECTRON_SKIP_BINARY_DOWNLOAD=1" >> "${GITHUB_ENV}"
          echo "PUPPETEER_SKIP_DOWNLOAD=1" >> "${GITHUB_ENV}"
          echo "SHARP_IGNORE_GLOBAL_LIBVIPS=1" >> "${GITHUB_ENV}"

      - name: 安装 npm 依赖
        run: npm install --ignore-scripts --legacy-peer-deps
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PUPPETEER_SKIP_DOWNLOAD: 1
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1

      - name: 单独安装 esbuild（Vite 8 transformWithEsbuild 依赖）
        run: npm install esbuild --no-save

      - name: 构建 Web 资源
        run: npx vite build
        env:
          ARCHIVE_RELEASE: '1'
          VITE_ARCHIVE_SALT: ${{ secrets.ARCHIVE_PRIVATE_SALT }}
          ARCHIVE_PRIVATE_SALT: ${{ secrets.ARCHIVE_PRIVATE_SALT }}
          VITE_INSTALL_KEY_A: ${{ secrets.INSTALL_KEY_A }}

      # ========== 临时禁用：干净构建，排除缓存污染 ==========
      # - name: 缓存 Android 工程
      #   id: cache-android
      #   uses: actions/cache@v4
      #   with:
      #     path: android
      #     key: android-project-v9-${{ hashFiles('capacitor.config.json') }}

      - name: 生成 Android 工程（每次全新生成，无缓存）
        run: |
          # 强制清理旧的 android 目录（如果存在，避免之前的残留冲突）
          if [ -d android ]; then
            echo "🗑️  清理旧的 android 目录..."
            rm -rf android
          fi
          echo "✨ 全新生成 Android 工程..."
          npx cap add android
          echo "✅ Android 工程生成完成"

      - name: 同步 Capacitor
        run: npx cap sync android

      - name: 配置 Android 工程（proguard + manifest shell 追加）
        run: |
          node scripts/setup-android.mjs

          MF="android/app/src/main/AndroidManifest.xml"
          echo ""
          echo "=== 处理前 manifest 头部 ==="
          head -5 "$MF"

          echo ""
          echo "=== Shell 追加权限（在 </manifest> 之前插入）==="
          # 备份
          cp "$MF" "${MF}.bak"

          # Step 1: 在 </manifest> 之前插入缺失的权限
          # 用 awk 逐行处理：遇到 </manifest> 时先输出权限再输出该行
          awk '
            BEGIN { added = 0 }
            /<\/manifest>/ && added == 0 {
              print "    <uses-permission android:name=\"android.permission.INTERNET\" />"
              print "    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />"
              print "    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />"
              print "    <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />"
              print "    <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\" />"
              added = 1
            }
            { print }
          ' "${MF}.bak" > "$MF"
          echo "✅ 权限已追加"

          echo ""
          echo "=== Shell 追加 Intent-filter（在 </activity> 之前插入）==="
          # 备份
          cp "$MF" "${MF}.bak2"

          # Step 2: 在 </activity> 之前插入 Intent-filter
          awk '
            BEGIN { added = 0 }
            /<\/activity>/ && added == 0 {
              print "        <!-- Receive external JSON files -->"
              print "        <intent-filter android:autoVerify=\"true\">"
              print "            <action android:name=\"android.intent.action.VIEW\" />"
              print "            <action android:name=\"android.intent.action.SEND\" />"
              print "            <action android:name=\"android.intent.action.SEND_MULTIPLE\" />"
              print "            <category android:name=\"android.intent.category.DEFAULT\" />"
              print "            <category android:name=\"android.intent.category.BROWSABLE\" />"
              print "            <data android:mimeType=\"application/json\" />"
              print "            <data android:mimeType=\"application/octet-stream\" />"
              print "            <data android:scheme=\"content\" />"
              print "            <data android:scheme=\"file\" />"
              print "        </intent-filter>"
              print "    "
              added = 1
            }
            { print }
          ' "${MF}.bak2" > "$MF"
          echo "✅ Intent-filter 已追加"

          # 清理备份
          rm -f "${MF}.bak" "${MF}.bak2"

          echo ""
          echo "=== 修改图标引用：mipmap → drawable ==="
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_launcher"|g' "$MF"
          sed -i 's|android:roundIcon="@mipmap/ic_launcher_round"|android:roundIcon="@drawable/ic_launcher_round"|g' "$MF"
          echo "✅ 图标引用已改为 drawable"

          echo ""
          echo "=== 处理后 manifest 完整内容 ==="
          cat "$MF"

          echo ""
          echo "=== 关键标签校验 ==="
          grep -q '<application' "$MF" || { echo "❌ 缺少 <application 开标签"; exit 1; }
          grep -q '</application>' "$MF" || { echo "❌ 缺少 </application> 闭标签"; exit 1; }
          grep -q '<manifest' "$MF" || { echo "❌ 缺少 <manifest 开标签"; exit 1; }
          grep -q '</manifest>' "$MF" || { echo "❌ 缺少 </manifest> 闭标签"; exit 1; }
          grep -q '<activity' "$MF" || { echo "❌ 缺少 <activity 标签"; exit 1; }
          grep -q 'android:icon="@drawable/ic_launcher"' "$MF" || { echo "❌ 缺少 drawable/ic_launcher 引用"; exit 1; }
          grep -q 'android:roundIcon="@drawable/ic_launcher_round"' "$MF" || { echo "❌ 缺少 drawable/ic_launcher_round 引用"; exit 1; }
          # 中文标签绝对禁止
          if grep -P '[\p{Han}]' "$MF"; then
            echo "❌ 检测到中文字符！manifest 被篡改！"
            exit 1
          fi
          echo "✅ 所有标签校验通过"

      - name: 注入启动图标（Logo → drawable）
        run: |
          echo "=== 检查 ImageMagick ==="
          if command -v convert >/dev/null 2>&1; then
            echo "✅ ImageMagick 已安装"
          else
            echo "⬇️ 安装 ImageMagick..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi

          RES_DIR="android/app/src/main/res"
          SRC="public/logo.jpg"
          if [ ! -f "$SRC" ]; then
            echo "❌ logo.jpg 不存在，终止构建"
            exit 1
          fi

          echo ""
          echo "=== 清理 Capacitor 默认图标资源 ==="
          rm -f "$RES_DIR"/mipmap-*/ic_launcher*.png
          rm -f "$RES_DIR"/mipmap-*/ic_launcher*.xml
          rm -f "$RES_DIR"/drawable/ic_launcher*.png
          rm -f "$RES_DIR"/drawable/ic_launcher*.xml
          echo "✅ 默认图标资源已清理"

          echo ""
          echo "=== 生成单尺寸 drawable 图标（512x512）==="
          mkdir -p "$RES_DIR/drawable"
          convert "$SRC" -resize 512x512 -gravity center -extent 512x512 \
            "$RES_DIR/drawable/ic_launcher.png"
          cp "$RES_DIR/drawable/ic_launcher.png" "$RES_DIR/drawable/ic_launcher_round.png"
          echo "✅ drawable/ic_launcher.png 生成"

          echo ""
          echo "=== 验证图标文件 ==="
          if [ ! -f "$RES_DIR/drawable/ic_launcher.png" ]; then
            echo "❌ drawable/ic_launcher.png 生成失败"
            exit 1
          fi
          ACTUAL_SIZE=$(identify -format "%wx%h" "$RES_DIR/drawable/ic_launcher.png" 2>/dev/null || echo "unknown")
          FILE_SIZE=$(stat -c%s "$RES_DIR/drawable/ic_launcher.png" 2>/dev/null || echo "0")
          echo "  drawable/ic_launcher.png → ${ACTUAL_SIZE}, 文件大小: ${FILE_SIZE} bytes"
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "❌ 图标文件太小（<1KB），可能生成失败"
            exit 1
          fi

      - name: 注入签名配置 + 混淆配置
        run: |
          echo "=== 创建 gradle.properties ==="
          cat > android/app/gradle.properties << 'EOF'
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=OrpheusArchive2026
          RELEASE_KEY_ALIAS=orpheus
          RELEASE_KEY_PASSWORD=OrpheusArchive2026
          EOF
          cat android/app/gradle.properties

          echo ""
          echo "=== 注入签名 + 混淆配置到 build.gradle ==="
          python3 scripts/inject-signing.py android/app/build.gradle

          echo ""
          echo "=== 强制关闭 shrinkResources + minifyEnabled ==="
          # 不管 inject-signing.py 是否成功，用 sed 全局强制替换
          sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle
          sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle

          echo ""
          echo "=== build.gradle 关键段落 ==="
          grep -n "signingConfigs\|buildTypes\|signingConfig\|ORPHEUS\|minifyEnabled\|shrinkResources\|proguard" android/app/build.gradle

          echo ""
          echo "=== 确认 shrinkResources 全部为 false ==="
          if grep -q "shrinkResources true" android/app/build.gradle; then
            echo "❌ 仍存在 shrinkResources true！"
            exit 1
          fi
          echo "✅ shrinkResources 已全部关闭"

          echo ""
          echo "=== 创建资源 keep 规则（双重保险）==="
          mkdir -p android/app/src/main/res/raw
          cat > android/app/src/main/res/raw/keep.xml << 'KEEPEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools"
              tools:keep="@drawable/ic_launcher,@drawable/ic_launcher_round" />
          KEEPEOF
          echo "✅ res/raw/keep.xml 已创建"

      # ========== 临时禁用：干净构建，排除缓存污染 ==========
      # - name: 缓存签名密钥
      #   id: keystore
      #   uses: actions/cache@v4
      #   with:
      #     path: android/app/release.keystore
      #     key: release-keystore-v1

      - name: 注入固定签名密钥（从 GitHub Secrets）
        run: |
          echo "🔐 从 GitHub Secrets 读取固定签名密钥..."
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "✅ 固定签名密钥注入完成"
          ls -la android/app/release.keystore
          echo "🔍 验证密钥信息..."
          keytool -list -keystore android/app/release.keystore -storepass OrpheusArchive2026 -J 2>&1 | head -20 || echo "⚠️ 验证警告（不影响构建）"

      - name: 验证图标资源 + Manifest 引用
        run: |
          RES_DIR="android/app/src/main/res"
          echo "=== 验证 drawable 图标资源 ==="
          if [ ! -f "$RES_DIR/drawable/ic_launcher.png" ]; then
            echo "❌ drawable/ic_launcher.png 缺失！"
            exit 1
          fi
          if [ ! -f "$RES_DIR/drawable/ic_launcher_round.png" ]; then
            echo "❌ drawable/ic_launcher_round.png 缺失！"
            exit 1
          fi
          echo "✅ drawable 图标资源验证通过"

          echo ""
          echo "=== 验证 AndroidManifest.xml 图标引用 ==="
          grep -q 'android:icon="@drawable/ic_launcher"' android/app/src/main/AndroidManifest.xml || { echo "❌ manifest 未引用 drawable/ic_launcher"; exit 1; }
          grep -q 'android:roundIcon="@drawable/ic_launcher_round"' android/app/src/main/AndroidManifest.xml || { echo "❌ manifest 未引用 drawable/ic_launcher_round"; exit 1; }
          echo "✅ Manifest 图标引用正确"

      - name: 清理 + 构建 Release APK
        run: |
          cd android
          RES_DIR="app/src/main/res"
          echo "=== 构建前检查 ==="
          echo "drawable 图标:"
          ls -la "$RES_DIR/drawable/ic_launcher"*.png 2>/dev/null || echo "❌ 没有 drawable 图标！"
          echo ""

          echo "=== 清理旧缓存 ==="
          ./gradlew clean

          echo ""
          echo "=== 开始构建 APK ==="
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD=OrpheusArchive2026 \
            -PRELEASE_KEY_ALIAS=orpheus \
            -PRELEASE_KEY_PASSWORD=OrpheusArchive2026

          echo ""
          echo "=== 构建完成 ==="
          find app/build/outputs/apk/release -name "*.apk" -ls
          cd ..

      - name: 验证 APK 包含图标资源
        run: |
          APK="$(find android/app/build/outputs/apk/release -name "*.apk" -not -name "*unsigned*" | head -1)"
          if [ -z "$APK" ]; then
            APK="$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)"
          fi
          echo "检查 APK $APK 中的图标资源..."

          echo ""
          echo "=== APK 中 res 类型统计 ==="
          unzip -l "$APK" | grep -oP 'res/[a-z-]+' | sort | uniq -c | sort -rn

          echo ""
          echo "=== aapt 资源检查（查找 launcher 图标）==="
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          AAPT_HAS_ICON=0
          if [ -x "$AAPT" ]; then
            echo "--- launcher/icon 相关资源 ---"
            "$AAPT" dump resources "$APK" 2>/dev/null | grep -i "launcher\|ic_launcher" | head -20 || echo "(无匹配)"
            echo ""
            echo "--- drawable 类型资源 ---"
            "$AAPT" dump resources "$APK" 2>/dev/null | grep "type/drawable" | head -20 || echo "(无匹配)"
            echo ""
            echo "--- 所有 drawable 资源 ---"
            "$AAPT" dump resources "$APK" 2>/dev/null | grep -c "type/drawable" || echo "0"
            echo "drawable 资源总数"

            # 用 aapt 验证：检查是否存在 ic_launcher 资源条目
            if "$AAPT" dump resources "$APK" 2>/dev/null | grep -q "ic_launcher"; then
              AAPT_HAS_ICON=1
              echo "✅ aapt 确认：APK 包含 ic_launcher 资源"
            else
              echo "⚠️  aapt 未找到 ic_launcher 条目"
            fi
          else
            echo "aapt 不在 PATH，跳过"
          fi

          echo ""
          echo "=== APK 全部文件列表（前 30 行）==="
          unzip -l "$APK" | head -30

          echo ""
          echo "=== 校验结果 ==="
          if [ "$AAPT_HAS_ICON" -eq 1 ]; then
            echo "✅ 图标验证通过，继续构建"
          else
            echo "⚠️  无法确认图标资源（aapt 未找到），但继续构建——安装到手机验证实际显示"
          fi

      - name: 重命名 APK
        run: |
          APK="$(find android/app/build/outputs/apk/release -name "*.apk" -not -name "*unsigned*" | head -1)"
          if [ -z "$APK" ]; then
            APK="$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)"
          fi
          if [ -z "$APK" ]; then
            echo "❌ 找不到 APK 文件！"
            find android/app/build/outputs/apk/ -name "*.apk" 2>/dev/null || echo "release 目录下无 APK"
            exit 1
          fi
          echo "找到 APK: $APK"
          cp "${APK}" "orpheus-archive.apk"
          echo "APK_PATH=orpheus-archive.apk" >> "${GITHUB_ENV}"
          ls -la orpheus-archive.apk

      - name: 上传 APK 产物（90 天保留）
        uses: actions/upload-artifact@v4
        with:
          name: orpheus-archive-apk
          path: orpheus-archive.apk
          retention-days: 90

      - name: 验证 APK 签名
        run: |
          if grep -c "APK Sig Block 42" "${{ env.APK_PATH }}" > /dev/null 2>&1; then
            echo "✅ APK V2 签名验证通过"
          else
            echo "⚠️ APK 未检测到 V2 签名（可能使用 debug 签名）"
          fi

      - name: 准备发布目录
        run: |
          mkdir -p dist/apk
          cp "${{ env.APK_PATH }}" "dist/apk/orpheus-archive.apk"
          echo "APK 已放入 dist/apk/"

      - name: 生成下载页和版本信息
        env:
          VERSION: v1.0.${{ github.run_number }}
          BUILD_NUM: ${{ github.run_number }}
          APK_PATH: ${{ env.APK_PATH }}
        run: node scripts/generate-apk-index.mjs

      - name: 上传 dist 目录（供 Netlify 部署）
        uses: actions/upload-artifact@v4
        with:
          name: dist-output
          path: dist
          retention-days: 7

  # ========== JOB 2: 发布到 GitHub Release（尽力而为，不阻断） ==========
  release:
    name: 发布到 GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: orpheus-archive-apk

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 奥菲斯帝国档案馆 v1.0.${{ github.run_number }}
          files: orpheus-archive.apk
          generate_release_notes: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========== JOB 3: 已移除 Netlify 部署（停止 APK 分发） ==========
