<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1000" viewBox="0 0 320 1000">
  <!-- 暗金铭文长卷：多列符文 + 装饰分隔，纵向重复铺满
       透明度刻意压低（0.15-0.22），保证背景不抢内容，仅在纯黑处隐约可见 -->
  <defs>
    <linearGradient id="runeGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f591c" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#7a4a18" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5c3812" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <g fill="url(#runeGold)" font-family="serif" font-weight="500">

    <!-- 左列符文 -->
    <g font-size="20" letter-spacing="10" text-anchor="start">
      <text x="28" y="40">ᚠᚢᚦᚨᚱᚲ</text>
      <text x="28" y="80">ᚷᚺᚾᛁᛃᛇ</text>
      <text x="28" y="120">ᛈᛉᛊᛏᛒᛖ</text>
      <text x="28" y="160">ᛗᛚᛜᛞᛟᚠ</text>
