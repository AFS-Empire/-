      <text x="28" y="240">ᚺᚾᛁᛃᛇᛈ</text>
      <text x="28" y="280">ᛉᛊᛏᛒᛖᛗ</text>
      <text x="28" y="320">ᛚᛜᛞᛟᚠᚢ</text>
      <text x="28" y="360">ᚦᚨᚱᚲᚷᚺ</text>
      <text x="28" y="400">ᚾᛁᛃᛇᛈᛉ</text>
      <text x="28" y="440">ᛊᛏᛒᛖᛗᛚ</text>
      <text x="28" y="480">ᛜᛞᛟᚠᚢᚦ</text>
      <text x="28" y="520">ᚨᚱᚲᚷᚺᚾ</text>
      <text x="28" y="560">ᛁᛃᛇᛈᛉᛊ</text>
      <text x="28" y="600">ᛏᛒᛖᛗᛚᛜ</text>
      <text x="28" y="640">ᛞᛟᚠᚢᚦᚨ</text>
      <text x="28" y="680">ᚱᚲᚷᚺᚾᛁ</text>
      <text x="28" y="720">ᛃᛇᛈᛉᛊᛏ</text>
      <text x="28" y="760">ᛒᛖᛗᛚᛜᛞ</text>
      <text x="28" y="800">ᛟᚠᚢᚦᚨᚱ</text>
      <text x="28" y="840">ᚲᚷᚺᚾᛁᛃ</text>
      <text x="28" y="880">ᛇᛈᛉᛊᛏᛒ</text>
      <text x="28" y="920">ᛖᛗᛚᛜᛞᛟ</text>
      <text x="28" y="960">ᚠᚢᚦᚨᚱᚲ</text>
    </g>

    <!-- 中列符文（偏移错落，避免规则感） -->
    <g font-size="18" letter-spacing="12" text-anchor="middle">
      <text x="160" y="60">ᚱᚢᚾᛟᚱᛗ</text>
      <text x="160" y="100">ᚠᚢᚦᚨᚱᚲ</text>
      <text x="160" y="140">ᚷᚺᚾᛁᛃᛇ</text>
      <text x="160" y="180">ᛈᛉᛊᛏᛒᛖ</text>
      <text x="160" y="220">ᛗᛚᛜᛞᛟᚠ</text>
      <text x="160" y="260">ᚢᚦᚨᚱᚲᚷ</text>
